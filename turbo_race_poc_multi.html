<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Race POC</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #090d16;
            color: #fff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HOST VIEW SPECIFIC STYLING */
        #host-screen {
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            background: #090d16;
            position: absolute;
            inset: 0;
            z-index: 40;
        }

        #host-screen.hidden {
            display: none;
        }

        .host-bottom-qr {
            height: 50vh;
            width: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
            border-top: 2px solid #222;
        }

        .host-qr-box {
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .host-qr-box svg {
            width: 180px;
            height: 180px;
        }

        /* TOP 15vh: HEADER & QR UI */
        #top-header {
            height: 15vh;
            width: 100%;
            background: #000;
            border-bottom: 2px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: relative;
            z-index: 10;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
        }

        .header-center {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }

        .hud-timer {
            font-family: monospace;
            font-size: 24px;
            font-weight: bold;
            color: #fbc531;
            line-height: 1;
        }

        .hud-status {
            font-size: 11px;
            color: #4cd137;
            font-weight: bold;
            margin-top: 2px;
        }

        /* WINNER / INTERMISSION OVERLAY IN HEADER */
        #winner-banner {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
        }

        #winner-banner.hidden {
            display: none !important;
        }

        #winner-title {
            font-size: 18px;
            font-weight: bold;
            color: #fbc531;
        }

        #next-race-countdown {
            font-size: 13px;
            color: #4cd137;
            font-weight: bold;
            font-family: monospace;
        }

        /* MIDDLE 35vh: RACETRACK CANVAS */
        #middle-track {
            height: 35vh;
            width: 100%;
            position: relative;
            background: #151c2c;
            border-bottom: 2px solid #222;
        }

        #track-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* BOTTOM 50vh: 2x2 CONTROLLER GRID */
        #bottom-screen {
            height: 50vh;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            padding: 6px;
            background: #000;
        }

        .tap-btn {
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.15);
        }

        .tap-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .tap-btn span.taps {
            font-size: 13px;
            opacity: 0.85;
            font-weight: normal;
            font-family: monospace;
        }

        /* Button Palette */
        #btn-0 { background: #e74c3c; }
        #btn-1 { background: #3498db; }
        #btn-2 { background: #2ecc71; color: #000; }
        #btn-3 { background: #f1c40f; color: #000; }

        .btn-ui {
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
    <!-- Include Firebase Libraries & QR Code Generator -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Firebase state initialization
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'turbo-race-gp';
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "demo", authDomain: "demo.firebaseapp.com", projectId: "demo" };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Room state helper
        const urlParams = new URLSearchParams(window.location.search);
        let roomCode = urlParams.get('room');
        
        // Auto-generate room code if on Host View and none provided
        if (!roomCode) {
            roomCode = Math.random().toString(36).substring(2, 7).toUpperCase();
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?room=' + roomCode;
            window.history.replaceState({path: newUrl}, '', newUrl);
        }

        window.roomCode = roomCode;
        window.db = db;
        window.appId = appId;
        window.doc = doc;
        window.setDoc = setDoc;
        window.updateDoc = updateDoc;
        window.onSnapshot = onSnapshot;

        // Sign in anonymously
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
        } else {
            signInAnonymously(auth);
        }
    </script>
</head>
<body>

    <!-- DEDICATED HOST VIEW SCREEN -->
    <div id="host-screen" class="hidden">
        <header id="top-header" style="height: 15vh;">
            <div class="header-title-box">
                <div style="font-size: 10px; color: #9ca3af; font-weight: bold;">HOST DISPLAY</div>
                <div style="font-size: 14px; color: #4cd137; font-weight: bold;">TURBO GP</div>
            </div>

            <div style="display: flex; gap: 6px; position: relative; z-index: 50; pointer-events: auto;">
                <button class="btn-ui" style="cursor: pointer;" onclick="switchToControllerView()">Race View</button>
            </div>

            <!-- WINNER / INTERMISSION OVERLAY IN HOST HEADER -->
            <div id="host-winner-banner" class="hidden" style="position: absolute; inset: 0; background: rgba(0,0,0,0.92); flex-direction: column; align-items: center; justify-content: center; z-index: 30; pointer-events: none;">
                <div id="host-winner-title" style="font-size: 18px; font-weight: bold; color: #fbc531;">RACER WINNER!</div>
                <div id="host-next-race-countdown" style="font-size: 13px; color: #4cd137; font-weight: bold; font-family: monospace;">NEXT RACE STARTS IN 5 SECONDS...</div>
            </div>
        </header>

        <section style="height: 35vh; width: 100%; position: relative; background: #151c2c;">
            <canvas id="host-track-canvas" style="width:100%; height:100%; display:block;"></canvas>
        </section>

        <footer class="host-bottom-qr">
            <div class="host-qr-box" id="host-qr-target"></div>
            <div style="font-size: 18px; font-weight: bold; color: #4cd137; margin-bottom: 4px;">SCAN TO JOIN & PLAY</div>
            <div style="font-size: 13px; color: #9ca3af; font-family: monospace;" id="room-code-display">ROOM: CODE</div>
        </footer>
    </div>

    <!-- RACE / CONTROLLER VIEW SCREEN -->
    <div id="race-view" style="height: 100vh; width: 100vw; display: flex; flex-direction: column;">
        <!-- TOP 15vh: HEADER BAR -->
        <header id="top-header" style="height: 15vh;">
            <div class="header-title-box">
                <div style="font-size: 10px; color: #9ca3af; font-weight: bold;">HOST DISPLAY</div>
                <div style="font-size: 14px; color: #4cd137; font-weight: bold;">TURBO GP</div>
            </div>

            <div style="display: flex; gap: 6px; position: relative; z-index: 50; pointer-events: auto;">
                <button class="btn-ui" style="cursor: pointer;" onclick="switchToHostView()">Host View</button>
            </div>

            <!-- WINNER / INTERMISSION OVERLAY -->
            <div id="winner-banner" class="hidden" style="position: absolute; inset: 0; background: rgba(0,0,0,0.92); flex-direction: column; align-items: center; justify-content: center; z-index: 30; pointer-events: none;">
                <div id="winner-title" style="font-size: 18px; font-weight: bold; color: #fbc531;">RACER WINNER!</div>
                <div id="next-race-countdown" style="font-size: 13px; color: #4cd137; font-weight: bold; font-family: monospace;">NEXT RACE STARTS IN 5 SECONDS...</div>
            </div>
        </header>

        <!-- MIDDLE 35vh: RACETRACK CANVAS -->
        <section id="middle-track">
            <canvas id="track-canvas"></canvas>
        </section>

        <!-- BOTTOM 50vh: 2x2 CONTROLLER GRID -->
        <footer id="bottom-screen">
            <button id="btn-0" class="tap-btn" onclick="tapRacer(0)">
                Racer 1
                <span class="taps" id="taps-0">0 Taps</span>
            </button>
            <button id="btn-1" class="tap-btn" onclick="tapRacer(1)">
                Racer 2
                <span class="taps" id="taps-1">0 Taps</span>
            </button>
            <button id="btn-2" class="tap-btn" onclick="tapRacer(2)">
                Racer 3
                <span class="taps" id="taps-2">0 Taps</span>
            </button>
            <button id="btn-3" class="tap-btn" onclick="tapRacer(3)">
                Racer 4
                <span class="taps" id="taps-3">0 Taps</span>
            </button>
        </footer>
    </div>

    <script>
        // Race State Configuration
        const TOTAL_RACE_TIME = 30; // 30 Second Race
        const INTERMISSION_TIME = 5; // 5 Seconds between continuous races
        const FINISH_LINE = 1000;

        const racers = [
            { name: "Racer 1", color: "#e74c3c", pos: 0, taps: 0, boost: 0 },
            { name: "Racer 2", color: "#3498db", pos: 0, taps: 0, boost: 0 },
            { name: "Racer 3", color: "#2ecc71", pos: 0, taps: 0, boost: 0 },
            { name: "Racer 4", color: "#f1c40f", pos: 0, taps: 0, boost: 0 }
        ];

        let isRunning = false;
        let isFinished = false;
        let isIntermission = false;
        let isHostView = false;
        let timeRemaining = TOTAL_RACE_TIME;
        let intermissionRemaining = INTERMISSION_TIME;
        let lastTimestamp = null;
        let timerInterval = null;

        // Canvas Setup
        const canvas = document.getElementById('track-canvas');
        const ctx = canvas.getContext('2d');
        const hostCanvas = document.getElementById('host-track-canvas');
        const hostCtx = hostCanvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            hostCanvas.width = hostCanvas.parentElement.clientWidth;
            hostCanvas.height = hostCanvas.parentElement.clientHeight;
            drawTrackOnContext(ctx, canvas.width, canvas.height);
            drawTrackOnContext(hostCtx, hostCanvas.width, hostCanvas.height);
        }

        window.addEventListener('resize', resizeCanvas);

        // Core Render Loop
        function gameLoop(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const delta = (timestamp - lastTimestamp) / 1000;
            lastTimestamp = timestamp;

            if (isRunning && !isFinished && !isIntermission) {
                const baseSpeedPerSec = FINISH_LINE / TOTAL_RACE_TIME;

                racers.forEach((racer) => {
                    racer.boost *= 0.92;
                    const currentSpeed = baseSpeedPerSec + racer.boost;
                    racer.pos += currentSpeed * delta;

                    if (racer.pos >= FINISH_LINE && !isFinished) {
                        triggerRaceFinish(racer.name);
                    }
                });
            }

            drawTrackOnContext(ctx, canvas.width, canvas.height);
            drawTrackOnContext(hostCtx, hostCanvas.width, hostCanvas.height);
            requestAnimationFrame(gameLoop);
        }

        // Render Racetrack helper
        function drawTrackOnContext(context, w, h) {
            if (!w || !h) return;
            const laneH = h / 4;
            const finishX = w - 40;

            // Background
            context.fillStyle = '#0f172a';
            context.fillRect(0, 0, w, h);

            // Render Lanes
            for (let i = 0; i < 4; i++) {
                const y = i * laneH;
                
                context.fillStyle = i % 2 === 0 ? 'rgba(15, 23, 42, 0.7)' : 'rgba(30, 41, 59, 0.7)';
                context.fillRect(0, y, w, laneH);

                context.strokeStyle = '#334155';
                context.lineWidth = 1;
                context.beginPath();
                context.moveTo(0, y);
                context.lineTo(w, y);
                context.stroke();

                context.fillStyle = '#94a3b8';
                context.font = 'bold 11px sans-serif';
                context.fillText(`Lane ${i + 1}`, 8, y + laneH / 2 + 4);
            }

            // Finish Line Checkers
            const checkSize = 8;
            for (let y = 0; y < h; y += checkSize) {
                context.fillStyle = (y / checkSize) % 2 === 0 ? '#ffffff' : '#000000';
                context.fillRect(finishX, y, checkSize * 2, checkSize);
            }

            // Draw Racers
            racers.forEach((racer, i) => {
                const laneY = i * laneH + laneH / 2;
                const ratio = Math.min(1, racer.pos / FINISH_LINE);
                const x = ratio * (finishX - 35) + 25;

                // Body
                context.fillStyle = racer.color;
                context.fillRect(x - 14, laneY - 10, 28, 20);

                context.strokeStyle = '#fff';
                context.lineWidth = 1;
                context.strokeRect(x - 14, laneY - 10, 28, 20);
            });
        }

        // Tap Booster Impulse
        function tapRacer(index) {
            if (!isRunning || isIntermission) return;

            const racer = racers[index];
            racer.taps += 1;
            racer.boost += 22;

            const tapElem = document.getElementById(`taps-${index}`);
            if (tapElem) tapElem.textContent = `${racer.taps} Taps`;

            // Sync tap online with Firebase Cloud Firestore
            if (window.db && window.roomCode) {
                try {
                    const roomRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', window.roomCode);
                    const updateData = {};
                    updateData[`racer_${index}_taps`] = racer.taps;
                    window.updateDoc(roomRef, updateData).catch(() => {});
                } catch (e) {}
            }
        }

        // View Switching Helpers
        function switchToHostView() {
            const hostScreen = document.getElementById('host-screen');
            if (hostScreen) hostScreen.classList.remove('hidden');
            resizeCanvas();
            renderHostQRCode();
        }

        function renderHostQRCode() {
            const qrTarget = document.getElementById('host-qr-target');
            const roomDisplay = document.getElementById('room-code-display');
            if (roomDisplay && window.roomCode) {
                roomDisplay.textContent = `ROOM: ${window.roomCode}`;
            }

            if (qrTarget && window.QRCode) {
                qrTarget.innerHTML = '';
                const currentUrl = window.location.href;
                new QRCode(qrTarget, {
                    text: currentUrl,
                    width: 160,
                    height: 160,
                    colorDark: "#000000",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        // Setup Firestore Listener for Cloud Multiplayer Sync
        function setupCloudSync() {
            if (!window.db || !window.roomCode) return;
            const roomRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', window.roomCode);

            // Listen for taps from all connected mobile devices
            window.onSnapshot(roomRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    racers.forEach((racer, i) => {
                        const remoteTaps = data[`racer_${i}_taps`] || 0;
                        if (remoteTaps > racer.taps) {
                            const diff = remoteTaps - racer.taps;
                            racer.taps = remoteTaps;
                            racer.boost += diff * 22;
                            const tapElem = document.getElementById(`taps-${i}`);
                            if (tapElem) tapElem.textContent = `${racer.taps} Taps`;
                        }
                    });
                } else {
                    // Initialize room doc on cloud
                    window.setDoc(roomRef, {
                        created: Date.now(),
                        racer_0_taps: 0,
                        racer_1_taps: 0,
                        racer_2_taps: 0,
                        racer_3_taps: 0
                    }).catch(() => {});
                }
            }, (error) => console.log(error));
        }

        // Trigger Finish & Start Continuous Countdown
        function triggerRaceFinish(winnerName) {
            isFinished = true;
            isIntermission = true;
            clearInterval(timerInterval);

            const winnerBanner = document.getElementById('winner-banner');
            const hostWinnerBanner = document.getElementById('host-winner-banner');
            const winnerTitle = document.getElementById('winner-title');
            const hostWinnerTitle = document.getElementById('host-winner-title');

            if (winnerTitle) winnerTitle.textContent = `${winnerName.toUpperCase()} WINS!`;
            if (hostWinnerTitle) hostWinnerTitle.textContent = `${winnerName.toUpperCase()} WINS!`;
            
            if (winnerBanner) {
                winnerBanner.classList.remove('hidden');
                winnerBanner.style.display = 'flex';
            }
            if (hostWinnerBanner) {
                hostWinnerBanner.classList.remove('hidden');
                hostWinnerBanner.style.display = 'flex';
            }

            intermissionRemaining = INTERMISSION_TIME;
            updateIntermissionDisplay();

            timerInterval = setInterval(() => {
                intermissionRemaining--;
                updateIntermissionDisplay();

                if (intermissionRemaining <= 0) {
                    clearInterval(timerInterval);
                    autoStartNextRace();
                }
            }, 1000);
        }

        function updateIntermissionDisplay() {
            const txt = `NEXT RACE STARTS IN ${intermissionRemaining} SECOND${intermissionRemaining === 1 ? '' : 'S'}...`;
            const nextCountdown = document.getElementById('next-race-countdown');
            const hostNextCountdown = document.getElementById('host-next-race-countdown');
            if (nextCountdown) nextCountdown.textContent = txt;
            if (hostNextCountdown) hostNextCountdown.textContent = txt;
        }

        function autoStartNextRace() {
            const winnerBanner = document.getElementById('winner-banner');
            const hostWinnerBanner = document.getElementById('host-winner-banner');
            if (winnerBanner) {
                winnerBanner.classList.add('hidden');
                winnerBanner.style.display = 'none';
            }
            if (hostWinnerBanner) {
                hostWinnerBanner.classList.add('hidden');
                hostWinnerBanner.style.display = 'none';
            }
            resetRace();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isRunning && !isFinished && !isIntermission) {
                    timeRemaining--;

                    if (timeRemaining <= 0) {
                        let winner = racers[0];
                        racers.forEach(r => {
                            if (r.pos > winner.pos) winner = r;
                        });
                        triggerRaceFinish(winner.name);
                    }
                }
            }, 1000);
        }

        function resetRace() {
            isFinished = false;
            isIntermission = false;
            isRunning = true;
            timeRemaining = TOTAL_RACE_TIME;

            racers.forEach((racer, i) => {
                racer.pos = 0;
                racer.taps = 0;
                racer.boost = 0;
                const tapElem = document.getElementById(`taps-${i}`);
                if (tapElem) tapElem.textContent = '0 Taps';
            });
            const winnerBanner = document.getElementById('winner-banner');
            const hostWinnerBanner = document.getElementById('host-winner-banner');
            if (winnerBanner) {
                winnerBanner.classList.add('hidden');
                winnerBanner.style.display = 'none';
            }
            if (hostWinnerBanner) {
                hostWinnerBanner.classList.add('hidden');
                hostWinnerBanner.style.display = 'none';
            }

            // Reset remote tap tallies
            if (window.db && window.roomCode) {
                try {
                    const roomRef = window.doc(window.db, 'artifacts', window.appId, 'public', 'data', 'rooms', window.roomCode);
                    window.updateDoc(roomRef, {
                        racer_0_taps: 0,
                        racer_1_taps: 0,
                        racer_2_taps: 0,
                        racer_3_taps: 0
                    }).catch(() => {});
                } catch(e) {}
            }

            startTimer();
        }

        // Start initialization and render loop safely on load
        window.onload = function() {
            resizeCanvas();
            resetRace();
            renderHostQRCode();
            setupCloudSync();
            requestAnimationFrame(gameLoop);
        };
    </script>
</body>
</html>
